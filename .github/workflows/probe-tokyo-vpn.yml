name: Tokyo VPN feasibility probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vpn-orbit-tokyo-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install explicit probe dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y openvpn iproute2 nftables curl openssl libc-bin
      - name: Runner forwarding diagnostics (non-secret)
        continue-on-error: true
        run: |
          sudo iptables -S FORWARD 2>&1 | head -20
          sudo iptables -S DOCKER-USER 2>&1 | head -10
          sudo nft list tables 2>&1 | head -20
          sysctl net.ipv4.ip_forward net.ipv4.conf.all.rp_filter
      - name: Run isolated feasibility probe
        env:
          IPAPI_IS_API_KEY: ${{ secrets.IPAPI_IS_API_KEY }}
        run: sudo --preserve-env=IPAPI_IS_API_KEY -- python3 -m vpn_orbit.cloud_probe --scan-window 40 --limit 10 --timeout-seconds 60
